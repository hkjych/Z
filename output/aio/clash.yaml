proxy-groups:
- name: 🔰 总模式
  type: select
  proxies:
  - ♻️ 自动选择
  - 🚀 手动选择
  - 🏅 优质节点
  - ⚡ 高速节点
  - ⏳ 延迟最低
  - 🔁 故障转移
  - ⚖️ 负载均衡
  - 🇨🇳 国内直连
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
- name: 🚀 手动选择
  type: select
  include-all-proxies: true
- name: 🏅 优质节点
  type: select
  include-all-proxies: true
  filter: 🏅
- name: ⚡ 高速节点
  type: select
  include-all-proxies: true
  filter: ⚡
- name: ⏳ 延迟最低
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 0
  lazy: false
  include-all-proxies: true
- name: 🔁 故障转移
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
- name: ⚖️ 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  include-all-proxies: true
- name: 🇨🇳 国内直连
  type: select
  proxies:
  - DIRECT
  - REJECT
rules:
- GEOIP,CN,🇨🇳 国内直连
- MATCH,🔰 总模式
