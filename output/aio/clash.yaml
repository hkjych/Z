  - 🏅 优质节点
  - ⏳ 延迟最低
  - 🔁 故障转移
  - ⚖️ 负载均衡
  - 🇨🇳 国内直连
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all-proxies: true
- name: 🚀 手动选择
  type: select
  include-all-proxies: true
- name: ⚡ 高速节点
  type: select
  include-all-proxies: true
  filter: ⚡
- name: 🏅 优质节点
  type: select
  include-all-proxies: true
  filter: 🏅
- name: ⏳ 延迟最低
