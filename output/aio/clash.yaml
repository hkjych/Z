  url: https://www.gstatic.com/generate_204
  interval: 300
  include-all-proxies: true
- name: ⚖️ 负载均衡
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 300
  strategy: round-robin
  include-all-proxies: true
- name: 🇨🇳 国内直连
  type: select
  proxies:
  - DIRECT
  - REJECT
rules:
- GEOIP,CN,🇨🇳 国内直连
- MATCH,🔰 总模式
